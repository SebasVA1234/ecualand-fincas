<title>Ecualand · Top 150 Fincas</title>
<style>
:root{
  --lima:#9dc11c;--verde:#158e3e;--morado:#915084;--magenta:#a64491;--rosa:#b680a4;--grafito:#3a3a3a;
  --ink:#242422;--ink2:#5d5d58;--muted:#8c8c86;
  --bg:#f4f5ef;--card:#fff;--card2:#fafbf6;--line:#e4e5dd;--line2:#d2d3c9;
  --limaS:#f0f6dc;--morS:#f5ecf3;
  --gA:#15803d;--gAb:#dcf5e3;--gB:#6b8f10;--gBb:#eef6d8;--gC:#a86b09;--gCb:#fdf0d8;--gD:#b3423a;--gDb:#fbe6e4;
  --sh:0 1px 2px rgba(58,58,58,.05),0 4px 16px rgba(58,58,58,.06);--sb:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-t="light"]){
  --ink:#f2f2ee;--ink2:#c3c3bc;--muted:#8e8e87;--bg:#1c1c1a;--card:#26261f;--card2:#2e2e27;
  --line:#3a3a33;--line2:#4a4a42;--limaS:#2c3714;--morS:#382634;
  --gA:#6cc385;--gAb:#16301d;--gB:#b7d64e;--gBb:#2c3714;--gC:#e2ac4d;--gCb:#3a2e16;--gD:#e5897f;--gDb:#3a211e;
  --sh:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);}}
:root[data-t="dark"]{--ink:#f2f2ee;--ink2:#c3c3bc;--muted:#8e8e87;--bg:#1c1c1a;--card:#26261f;--card2:#2e2e27;
  --line:#3a3a33;--line2:#4a4a42;--limaS:#2c3714;--morS:#382634;
  --gA:#6cc385;--gAb:#16301d;--gB:#b7d64e;--gBb:#2c3714;--gC:#e2ac4d;--gCb:#3a2e16;--gD:#e5897f;--gDb:#3a211e;
  --sh:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.3);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.wrap{padding:0 14px;max-width:760px;margin:0 auto}
.top{position:sticky;top:0;z-index:30;background:var(--grafito);padding:calc(env(safe-area-inset-top,0px) + 10px) 0 10px}
.top .row{display:flex;align-items:center;gap:10px}
.top img{height:26px;width:auto;display:block;flex:none}
.top .t{flex:1;min-width:0;color:#fff;font-size:12.5px;font-weight:600}
.top .t small{display:block;font-weight:400;font-size:10.5px;opacity:.65}
.icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);color:#fff;font-size:16px;flex:none}
.fil{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 6px}
.f{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--sh)}
.f input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font-size:16px;padding:12px 0;outline:none}
.f .clr{color:var(--muted);font-size:19px;padding:6px;margin-right:-6px}
.lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:9px 2px 5px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 4px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--morado);border-color:var(--morado);color:#fff}
.chip.ord[aria-pressed="true"]{background:var(--lima);border-color:var(--lima);color:#25300a}
.hint{font-size:11.5px;color:var(--muted);padding:6px 2px 2px}
.list{padding-bottom:calc(26px + var(--sb))}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--sh)}
.card:active{background:var(--card2)}
.card .r1{display:flex;align-items:center;gap:10px}
.card .rk{flex:none;width:32px;font-size:15px;font-weight:800;color:var(--muted);text-align:center}
.card .nm{flex:1;min-width:0;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb{flex:none;font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--morS);color:var(--morado)}
.g{display:inline-block;font-weight:800;font-size:10.5px;padding:2px 8px;border-radius:999px}
.gA{background:var(--gAb);color:var(--gA)}.gB{background:var(--gBb);color:var(--gB)}
.gC{background:var(--gCb);color:var(--gC)}.gD{background:var(--gDb);color:var(--gD)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.tri>div{background:var(--card2);border-radius:9px;padding:7px 8px;text-align:center;min-width:0}
.tri s{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;text-decoration:none}
.tri b{display:block;font-size:15px;font-weight:800;margin-top:2px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.det{display:none;padding-bottom:calc(30px + var(--sb))}
.det.on{display:block}
.back{display:inline-flex;align-items:center;gap:7px;color:var(--verde);font-weight:700;font-size:14.5px;padding:12px 2px}
.hero{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--lima);border-radius:14px;padding:15px;box-shadow:var(--sh)}
.hero h2{font-size:21px}
.hero .rz{font-size:12px;color:var(--muted);margin-top:3px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--ink2)}
.tag.m{background:var(--morS);color:var(--morado);border-color:transparent}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:11px}
.big>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center;box-shadow:var(--sh);min-width:0}
.big s{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;text-decoration:none}
.big b{display:block;font-size:19px;font-weight:800;margin-top:3px;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.crec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:11px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px}
.crec .v{font-size:38px;font-weight:800;line-height:1;white-space:nowrap}
.crec .d{font-size:12.5px;color:var(--ink2)}
.blk{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:11px;box-shadow:var(--sh);padding:14px}
.blk h3{font-size:15px;margin-bottom:3px}
.blk .sub{font-size:12px;color:var(--muted);margin-bottom:11px}
.hbr{display:grid;grid-template-columns:52px 1fr 66px;align-items:center;gap:8px;padding:4px 0}
.hbr.pico{background:var(--card2);border-radius:7px;padding:4px 6px;margin:0 -6px}
.hm{font-size:11.5px;color:var(--ink2);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr2{grid-template-columns:96px 1fr 74px}
.hbb{display:block;height:11px;border-radius:6px;background:var(--line);overflow:hidden;min-width:0}
.hbb i{display:block;height:100%;border-radius:6px}
.hv{font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.pr{display:grid;grid-template-columns:20px 1fr 74px;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr .i{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right}
.pr .m{min-width:0}
.pr .m b{display:block;font-size:13.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .m span{font-size:10.5px;color:var(--muted)}
.pr .q{text-align:right}
.pr .q b{display:block;font-size:13px;font-weight:800}
.pr .q span{font-size:10.5px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:var(--lima);margin-top:4px}
.mie{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.mie button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--card2);font-size:13px;text-align:left}
.mie button b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mie button span{font-weight:800;white-space:nowrap;color:var(--verde)}
.cons{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.cons th{text-align:right;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 0 6px 9px;white-space:nowrap}
.cons th:first-child{padding-left:0}
.cons th:first-child{text-align:left}
.cons td{padding:9px 0 9px 9px;border-top:1px solid var(--line);text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.cons td:first-child{padding-left:0}
.cons td:first-child{text-align:left;font-weight:600;white-space:normal}
.cons tr.tot td{border-top:2px solid var(--lima);font-weight:800;color:var(--verde)}
.cons .nm2{display:block;overflow:hidden;text-overflow:ellipsis}
.cons .pp{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.cons .ab{cursor:pointer}
.cons .ab .nm2::before{content:'▸ ';color:var(--lima);font-weight:800}
.cons tr.open .nm2::before{content:'▾ '}
.mdet{background:var(--card2);border-radius:10px;padding:12px;margin:2px 0 8px}
.mdet h4{margin:0 0 8px;font-size:13.5px}
.mdet .sub{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.mdet .big>div{padding:9px 6px}
.mdet .big b{font-size:15.5px}
.mdet .big s{font-size:9px}
.none{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}
footer{padding:22px 0 calc(28px + var(--sb));color:var(--muted);font-size:11.5px;text-align:center}
.pesa{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 2px 0;font-size:11.5px;color:var(--ink2)}
.pesa span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip{flex:none;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
</style>

<script type="text/plain" id="app">
const D=JSON.parse(document.getElementById('d').textContent), E=D.ents, BY={};
E.forEach(e=>BY[e.id]=e);
const M3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const C={lima:'#9dc11c',verde:'#158e3e',mor:'#915084',mag:'#a64491'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf=(v,d=0)=>v==null||isNaN(v)?'—':v.toLocaleString('es-EC',{minimumFractionDigits:d,maximumFractionDigits:d});
const kf=v=>v==null?'—':v===0?'0':Math.abs(v)>=1e6?nf(v/1e6,1)+'M':Math.abs(v)>=1000?nf(v/1000,Math.abs(v)<10000?1:0)+'k':nf(v,Math.abs(v)<10?1:0);
const $$=v=>v==null?'—':'$'+nf(Math.round(v));
const pc=(v,d=0)=>v==null?'—':v>4?'×'+nf(1+v,1):(v>0?'+':'')+nf(v*100,d)+' %';  // arriba de +400 % se lee mejor como multiplicador
const ym3=y=>M3[+y.split('-')[1]-1]+' '+y.slice(2,4);
// peso en lo que compra Ecualand: las fincas chicas necesitan más decimales para no verse como 0,0 %
const pp=v=>{if(v==null)return '—';const x=v*100;return x===0?'0 %':x<0.01?'<0,01 %':nf(x,x<0.1?2:1)+' %';};
const gch=g=>g?`<span class="g g${g}">${g}</span>`:'';
const ft=t=>{if(t==null)return '—';const x=t*100;return x===0?'0 %':nf(x,x<0.1?2:1)+' %';};
// fechas del corte, para no dejarlas escritas a mano
const fd=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return (+d)+'-'+M3[+m-1]+'-'+y;};
const colTasa=t=>t<=D.g_tasa?'var(--verde)':t<=D.g_tasa*1.5?'var(--gC)':'var(--gD)';
const colTasaBg=t=>t<=D.g_tasa?'var(--gAb)':t<=D.g_tasa*1.5?'var(--gCb)':'var(--gDb)';
function chipRec(r){
  if(!r||r.casos===0) return `<span class="rchip" style="background:var(--gAb);color:var(--verde)">Sin reclamos</span>`;
  if(!r.tasa) return `<span class="rchip" style="background:var(--gAb);color:var(--verde)">Sin reclamos válidos</span>`;
  return `<span class="rchip" style="background:${colTasaBg(r.tasa)};color:${colTasa(r.tasa)}">Reclamos ${ft(r.tasa)}</span>`;
}
function bloqueRec(r,h='h3',full=true){
  if(!r||r.casos===0) return `<div class="sub">Sin reclamos registrados en el período.</div>`;
  const est=[['ACEPTADO','Aceptado','var(--verde)'],['MEDIACIÓN','Mediación','var(--lima)'],['NO ACEPTADO','No aceptado','var(--gD)'],['NUEVO','Nuevo','var(--muted)']]
    .map(([k,l,c])=>({l,c,...r.estados[k]}));
  const mxE=Math.max(...est.map(x=>x.n),1);
  const mxM=Math.max(...(r.motivos||[]).map(m=>m.pct),0)||1;
  return `<div class="big" style="margin-top:0">
      <div><s>Reclamos</s><b class="num">${nf(r.casos)}</b><span style="font-size:10px;color:var(--muted)">${nf(r.lineas)} líneas</span></div>
      <div><s>Reclamado válido</s><b class="num">${$$(r.usd_val)}</b>${r.usd-r.usd_val>=1?`<span style="font-size:10px;color:var(--muted)">de ${$$(r.usd)}</span>`:''}</div>
      <div><s>Del total comprado</s><b class="num" style="color:${colTasa(r.tasa)}">${ft(r.tasa)}</b></div>
    </div>
    <div class="sub" style="margin:6px 0 0">Válidos = aceptados + mediación. Promedio Ecualand: ${ft(D.g_tasa)} de lo comprado.</div>
    ${r.acep!=null?`<div class="sub" style="margin-top:2px">Aceptó el <b>${nf(r.acep*100,0)} %</b> de las líneas de reclamo ya resueltas (promedio ${nf(D.g_acep*100,0)} %).</div>`:''}
    ${full?`<div style="margin-top:10px"><div class="sub" style="margin-bottom:4px">Por estado · líneas y dólares</div>
    ${est.map(x=>`<div class="hbr hbr2"><span class="hm">${x.l}</span>
      <span class="hbb"><i style="width:${Math.max(x.n>0?3:0,100*x.n/mxE).toFixed(1)}%;background:${x.c}"></i></span>
      <b class="hv" style="color:${x.c}">${x.n} · ${$$(x.usd)}</b></div>`).join('')}
    </div>`:''}
    ${r.motivos&&r.motivos.length?`<${h} style="margin-top:14px;font-size:13.5px">Motivos principales</${h}>
    ${full?r.motivos.map(m=>`<div class="hbr hbr2"><span class="hm">${esc(m.m)}</span>
      <span class="hbb"><i style="width:${Math.max(3,100*m.pct/mxM).toFixed(1)}%;background:var(--morado)"></i></span>
      <b class="hv">${nf(m.pct*100,0)} % · ${$$(m.usd)}</b></div>`).join(''):r.motivos.slice(0,3).map(m=>`<div class="sub">${esc(m.m)}: ${nf(m.pct*100,0)} % · ${$$(m.usd)}</div>`).join('')}`:''}
    ${full&&r.variedades&&r.variedades.length?`<${h} style="margin-top:14px;font-size:13.5px">Variedades más reclamadas</${h}>
    ${r.variedades.map(v=>`<div class="pr"><span class="i"></span><span class="m"><b>${esc(v.v)}</b></span>
      <span class="q"><b>${$$(v.usd)}</b><span>${nf(v.n)} ${v.n===1?'línea':'líneas'}</span></span></div>`).join('')}`:''}`;
}

/* ---------- lista ---------- */
let q='', grupo='Todos', orden='usd';
const elL=document.getElementById('lista');
document.getElementById('cg').innerHTML=['Todos',...D.grupos.filter(g=>g!=='Sin grupo'),'Sin grupo']
  .map(g=>`<button class="chip" data-g="${esc(g)}" aria-pressed="${g==='Todos'}">${esc(g)}</button>`).join('');

function filtradas(){
  const t=q.trim().toLowerCase();
  let r=E.filter(e=>{
    if(grupo!=='Todos'&&e.grupo!==grupo) return false;
    if(!t) return true;
    return (e.nombre+' '+(e.razon||'')+' '+(e.fincas||[]).join(' ')+' '+e.grupo).toLowerCase().includes(t);
  });
  const val=orden==='rec'?e=>e.rec?.tasa:e=>e[{usd:'usd',fb:'fb',tallos:'tallos',crec:'crec_6m'}[orden]];
  return [...r].sort((a,b)=>(val(b)??-Infinity)-(val(a)??-Infinity));
}
function tarjeta(e){
  const cr=e.crec_6m;
  return `<button class="card" data-i="${esc(e.id)}">
    <div class="r1"><span class="rk num">${e.rank}</span>
      <span class="nm">${esc(e.nombre)}</span>
      ${e.tipo==='grupo'?`<span class="gb">GRUPO · ${e.fincas.length}</span>`:''}
      ${gch(e.nivel)}</div>
    <div class="tri">
      <div><s>Dólares</s><b class="num">${$$(e.usd)}</b></div>
      <div><s>Fulles</s><b class="num">${nf(e.fb,0)}</b></div>
      <div><s>Tallos</s><b class="num">${kf(e.tallos)}</b></div>
    </div>
    <div class="pesa"><span>Pesa <b class="num" style="color:var(--ink)">${pp(e.part?.fb)}</b> de nuestras fulles</span>${chipRec(e.rec)}</div>
    ${cr!=null?`<div class="hint" style="padding:5px 2px 0">Crecimiento último semestre: <b style="color:${cr>=0?'var(--verde)':'var(--gD)'}">${pc(cr)}</b></div>`:''}
  </button>`;
}
function pinta(){
  const r=filtradas();
  document.getElementById('hint').textContent=`${r.length} de ${E.length} · cubren el ${nf(D.cubre*100,0)} % de la compra`;
  elL.innerHTML=r.length?r.map(tarjeta).join(''):'<div class="none">Ninguna coincide.<br>Probá con otro nombre.</div>';
  elL.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>abrir(b.dataset.i)));
}

/* ---------- detalle ---------- */
function serieH(pts,key,fmt){
  const vals=pts.map(p=>p[key]||0), mx=Math.max(...vals,0)||1, iM=vals.indexOf(mx);
  return pts.map((p,i)=>{
    const v=vals[i], col=p.ym<'2026'?C.mor:C.lima;
    return `<div class="hbr${i===iM?' pico':''}"><span class="hm">${ym3(p.ym)}</span>
      <span class="hbb"><i style="width:${Math.max(v>0?3:0,100*v/mx).toFixed(1)}%;background:${col}"></i></span>
      <b class="hv" style="color:${col}">${fmt(v)}</b></div>`;}).join('');
}
function detalle(e){
  const mx=Math.max(...e.top.map(t=>t.t),1);
  const prods=e.top.length?e.top.map((t,i)=>`<div class="pr"><span class="i">${i+1}</span>
      <span class="m"><b>${esc(t.v)}</b><span>${esc(t.p||'—')}</span>
        <div class="bar" style="width:${Math.max(4,100*t.t/mx)}%"></div></span>
      <span class="q"><b>${kf(t.t)}</b><span>${nf(t.pct*100,1)} %</span></span></div>`).join('')
    :'<div class="none">Sin detalle de producto</div>';
  const cr=e.crec_6m;
  return `<div class="hero">
    <h2>${esc(e.nombre)}</h2>
    ${e.razon?`<div class="rz">${esc(e.razon)}</div>`:''}
    <div class="tags">
      <span class="tag m">${e.tipo==='grupo'?`Grupo de ${e.fincas.length} fincas`:'Finca'}</span>
      ${e.grupo!=='Sin grupo'&&e.tipo!=='grupo'?`<span class="tag m">${esc(e.grupo)}</span>`:''}
      <span class="tag">Puesto ${e.rank} de ${E.length}</span>
      ${e.primera?`<span class="tag">Desde ${e.primera.slice(0,4)}</span>`:'<span class="tag">Nueva</span>'}
      ${e.nivel?`<span class="tag">Nivel ${e.nivel}${e.puntaje?' · '+nf(e.puntaje,1):''}</span>`:''}
    </div>
  </div>
  ${e.tipo==='grupo'?`<div class="blk"><h3>Consolidado del grupo</h3>
    <div class="sub">Qué se lleva cada finca y cuánto suma el grupo. Tocá una fila para ver su detalle.</div>
    <table class="cons"><thead><tr><th>Finca</th><th>Dólares</th><th>Fulles</th><th>Tallos</th><th>Peso FB</th></tr></thead><tbody>
    ${e.miembros.map((m,i)=>`<tr class="ab" data-m="${i}"><td><span class="nm2">${esc(m.nombre)}</span>
        <span class="pp">${m.primera?'desde '+m.primera.slice(0,4):'nueva'}${m.nivel?' · nivel '+m.nivel:''} · ${nf(100*m.usd/(e.usd||1),0)} % del grupo${!m.rec?'':m.rec.casos===0?' · sin reclamos':(m.rec.tasa?' · reclamos '+ft(m.rec.tasa):' · sin reclamos válidos')}</span></td>
      <td>${$$(m.usd)}</td><td>${nf(m.fb,0)}</td><td>${kf(m.tallos)}</td><td>${pp(m.part?.fb)}</td></tr>
      <tr class="exp" data-e="${i}" hidden><td colspan="5" style="padding:0 0 4px"><div class="mdet" id="md${i}"></div></td></tr>`).join('')}
    <tr class="tot"><td>TOTAL ${esc(e.nombre)}</td><td>${$$(e.usd)}</td><td>${nf(e.fb,0)}</td><td>${kf(e.tallos)}</td><td>${pp(e.part?.fb)}</td></tr>
    </tbody></table></div>`:''}
  <div class="big">
    <div><s>Dólares</s><b class="num">${$$(e.usd)}</b></div>
    <div><s>Fulles</s><b class="num">${nf(e.fb,0)}</b></div>
    <div><s>Tallos</s><b class="num">${kf(e.tallos)}</b></div>
  </div>
  <div class="blk"><h3>Cuánto nos representa</h3>
    <div class="sub">De todo lo que compra Ecualand del ${fd(D.desde)} al ${fd(D.corte)}.</div>
    ${(()=>{
      // la barra se escala contra el mayor de los tres part (fb/tallos/usd) de esta misma entidad,
      // así siempre hay al menos una barra llena y las otras se comparan entre sí de forma legible
      const p=e.part||{}, mxP=Math.max(p.fb||0,p.tallos||0,p.usd||0,0.0001);
      const filas=[['Fulles',p.fb],['Tallos',p.tallos],['Dólares',p.usd]];
      return filas.map(([l,v])=>`<div class="hbr"><span class="hm">${l}</span>
        <span class="hbb"><i style="width:${Math.max(v>0?3:0,100*(v||0)/mxP).toFixed(1)}%;background:var(--lima)"></i></span>
        <b class="hv">${pp(v||0)}</b></div>`).join('');
    })()}
    ${e.rank_fb&&e.rank_tallos?`<div class="sub" style="margin:8px 0 0">Puesto <b>${e.rank_fb}</b> en fulles y <b>${e.rank_tallos}</b> en tallos entre ${D.n_total} proveedores.</div>`:''}
  </div>
  ${cr!=null?`<div class="crec"><div class="v" style="color:${cr>=0?'var(--verde)':'var(--gD)'}">${pc(cr)}</div>
    <div class="d">Así creció con nosotros.<br>Comparamos <b>del 1 de abril al ${(+D.corte.slice(8))} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][+D.corte.slice(5,7)-1]} de 2026</b> (${$$(e.act_6m)}) contra el mismo período de 2025 (${$$(e.base_6m)}).</div></div>`:''}
  <div class="blk"><h3>Cuánto le compramos, mes a mes</h3>
    <div class="sub">En dólares. Morado 2025, verde 2026. El mes más alto va resaltado.</div>
    ${serieH(e.mensual,'usd',v=>'$'+kf(v))}
    <h3 style="margin-top:16px">Fulles por mes</h3><div class="sub">Cajas despachadas.</div>
    ${serieH(e.mensual,'fb',v=>nf(v,v<10?1:0))}
  </div>
  <div class="blk"><h3>Reclamos</h3>${bloqueRec(e.rec,'h3',true)}</div>
  <div class="blk"><h3>Los 12 productos que más le compramos</h3>
    <div class="sub">Por tallos, del ${fd(D.desde)} al ${fd(D.corte_productos)}.</div>${prods}</div>`;
}
function detalleMiembro(m){
  const mx=Math.max(...m.top.map(t=>t.t),1);
  const prods=m.top.length?m.top.slice(0,12).map((t,i)=>`<div class="pr"><span class="i">${i+1}</span>
      <span class="m"><b>${esc(t.v)}</b><span>${esc(t.p||'—')}</span>
      <div class="bar" style="width:${Math.max(4,100*t.t/mx)}%"></div></span>
      <span class="q"><b>${kf(t.t)}</b><span>${nf(t.pct*100,1)} %</span></span></div>`).join('')
    :'<div class="sub">Sin detalle de producto</div>';
  return `<h4>${esc(m.nombre)}</h4>
    <div class="sub">${esc(m.razon)}${m.crec_6m!=null?` · crecimiento del semestre <b style="color:${m.crec_6m>=0?'var(--verde)':'var(--gD)'}">${pc(m.crec_6m)}</b>`:''}</div>
    <div class="big" style="margin:0 0 6px">
      <div><s>Dólares</s><b class="num">${$$(m.usd)}</b></div>
      <div><s>Fulles</s><b class="num">${nf(m.fb,0)}</b></div>
      <div><s>Tallos</s><b class="num">${kf(m.tallos)}</b></div>
    </div>
    <div class="sub">Pesa <b class="num">${pp(m.part?.fb)}</b> de nuestras fulles · <b class="num">${pp(m.part?.tallos)}</b> de los tallos</div>
    <h4 style="margin-top:12px">Cuánto le compramos, mes a mes</h4><div class="sub">En dólares.</div>
    ${serieH(m.mensual,'usd',v=>'$'+kf(v))}
    <h4 style="margin-top:12px">Reclamos</h4>${bloqueRec(m.rec,'h4',false)}
    <h4 style="margin-top:12px">Sus 12 productos principales</h4>${prods}`;
}

function abrir(id){
  const e=BY[id]; if(!e) return;
  document.getElementById('db').innerHTML=detalle(e);
  document.getElementById('vLista').style.display='none';
  document.getElementById('vDet').classList.add('on');
  document.querySelectorAll('.cons tr.ab').forEach(tr=>tr.addEventListener('click',()=>{
    const i=+tr.dataset.m, fila=document.querySelector(`.exp[data-e="${i}"]`), caja=document.getElementById('md'+i);
    const abierto=!fila.hidden;
    if(!abierto && !caja.dataset.listo){ caja.innerHTML=detalleMiembro(e.miembros[i]); caja.dataset.listo='1'; }
    fila.hidden=abierto; tr.classList.toggle('open',!abierto);
  }));
  history.replaceState(null,'','#'+e.rank); window.scrollTo(0,0);
}
function cerrar(){document.getElementById('vDet').classList.remove('on');document.getElementById('vLista').style.display='';history.replaceState(null,'','#');window.scrollTo(0,0);}
document.getElementById('back').addEventListener('click',cerrar);
document.getElementById('q').addEventListener('input',ev=>{q=ev.target.value;document.getElementById('clr').hidden=!q;pinta();});
document.getElementById('clr').addEventListener('click',()=>{q='';document.getElementById('q').value='';document.getElementById('clr').hidden=true;pinta();});
document.getElementById('cg').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;
  document.querySelectorAll('#cg .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');grupo=b.dataset.g;pinta();});
document.getElementById('co').addEventListener('click',ev=>{const b=ev.target.closest('.chip');if(!b)return;
  document.querySelectorAll('#co .chip').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');orden=b.dataset.o;pinta();});
document.getElementById('tema').addEventListener('click',()=>{
  const c=document.documentElement.getAttribute('data-t');
  const dk=c?c==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-t',dk?'light':'dark');});
document.getElementById('corte').textContent='datos al '+new Date(D.corte+'T12:00:00').toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'});
pinta();
document.getElementById('pie').textContent=`Ecualand Farms · compras y reclamos del ${fd(D.desde)} al ${fd(D.corte)} · productos al ${fd(D.corte_productos)}`;
const h0=E.find(e=>String(e.rank)===location.hash.slice(1)); if(h0) abrir(h0.id);
</script>
<script>
if ('serviceWorker' in navigator) {
  // al activarse una versión nueva se recarga una vez (solo si ya había una versión anterior controlando la página)
  const habia = !!navigator.serviceWorker.controller;
  let recargada = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habia && !recargada) { recargada = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW:', e)));
}
// Botón de instalar: Android lo ofrece, iOS se hace desde Compartir
let promptDiferido = null;
addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); promptDiferido = e;
  const b = document.getElementById('instalar');
  if (b) { b.hidden = false; b.onclick = async () => { b.hidden = true; promptDiferido.prompt(); await promptDiferido.userChoice; promptDiferido = null; }; }
});
addEventListener('appinstalled', () => { const b = document.getElementById('instalar'); if (b) b.hidden = true; });
</script>

  <div style="font-size:18px;font-weight:700">Compras por finca</div>
  <div style="font-size:13px;opacity:.7;margin:6px 0 20px;max-width:290px">Uso interno. Escribí el código de acceso que te pasó el equipo; se pide una sola vez en este teléfono.</div>
  <form id="lockf" style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px">
    <input id="lockc" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="código de acceso" aria-label="Código de acceso"
      style="font-size:17px;padding:13px 14px;border-radius:12px;border:0;text-align:center;color:#242422;background:#fff">
    <button style="font-size:16px;font-weight:800;padding:13px;border-radius:12px;background:var(--lima);color:#25300a">Entrar</button>
    <div id="locke" style="font-size:13px;color:#ffb4ab;min-height:18px"></div>
  </form>
</div>
<script>
(async () => {
  const P = JSON.parse(document.getElementById('denc').textContent);
  const lock = document.getElementById('lock'), err = document.getElementById('locke');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norma = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s_-]+/g, '').toLowerCase();
  async function abre(cod) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norma(cod)), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.s), iterations: P.it, hash: 'SHA-256'},
                                           base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, k, b64(P.ct)));
  }
  function arranca(json) {
    document.getElementById('d').textContent = json;
    const s = document.createElement('script');
    s.textContent = document.getElementById('app').textContent;
    document.body.appendChild(s);
    lock.style.display = 'none';
  }
  if (!window.crypto || !crypto.subtle) { lock.style.display = 'flex'; err.textContent = 'Abrí el enlace con https:// para poder entrar.'; return; }
  let guardado = null;
  try { guardado = localStorage.getItem('ecl-codigo'); } catch (e) {}
  if (guardado) {
    try { arranca(await abre(guardado)); return; }
    catch (e) { try { localStorage.removeItem('ecl-codigo'); } catch (_) {} }   // cambió el código: se vuelve a pedir
  }
  lock.style.display = 'flex';
  document.getElementById('lockf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const cod = document.getElementById('lockc').value;
    err.textContent = 'Abriendo…';
    try {
      const json = await abre(cod);
      try { localStorage.setItem('ecl-codigo', norma(cod)); } catch (e) {}
      err.textContent = ''; arranca(json);
    } catch (e) { err.textContent = 'Código incorrecto.'; }
  });
})();
</script>
