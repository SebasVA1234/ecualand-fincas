<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3a3a3a">
<title>Ecualand · App retirada</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#3a3a3a;color:#fff;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
main{max-width:340px;display:grid;gap:10px}
h1{font-size:20px;margin:0}
p{margin:0;opacity:.8;font-size:14.5px}
#estado{font-size:13px;opacity:.6}
</style>
</head>
<body>
<main>
  <h1>Esta app fue retirada</h1>
  <p>Ya no está disponible. Los datos que estaban guardados en este teléfono se borraron.</p>
  <p>Si la tenías instalada, ya podés eliminar el ícono de Ecualand de tu pantalla de inicio.</p>
  <p id="estado">Borrando datos…</p>
</main>
<script>
/* Borra solo lo de esta app: el dominio sebasva1234.github.io lo comparten otras páginas de la cuenta. */
(async () => {
  try { ['ecl-codigo', 'expoflor26-ruta', 'ecl-cargueras', 'ecl-ios-aviso'].forEach(k => localStorage.removeItem(k)); } catch (e) {}
  try { if ('caches' in self) for (const k of await caches.keys()) if (k.startsWith('ecualand-')) await caches.delete(k); } catch (e) {}
  try {
    if ('serviceWorker' in navigator)
      for (const r of await navigator.serviceWorker.getRegistrations())
        if (r.scope.includes('/ecualand-fincas/') || new URL(r.scope).origin === location.origin && location.pathname.startsWith(new URL(r.scope).pathname)) await r.unregister();
  } catch (e) {}
  document.getElementById('estado').textContent = 'Listo: no queda nada de la app en este teléfono.';
})();
</script>
</body>
</html>
