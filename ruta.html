<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#3a3a3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ruta ExpoFlor 2026</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --ink:#18221C; --muted:#5D6B62; --line:#DCE3DD; --soft:#E9EEEA;
  --done:#2B8A3E; --done-soft:#E3F4E6; --g1:#18221C; --g2:#FFFFFF;
  --day:#D9480F;
  --display:"Avenir Next", "Segoe UI", Roboto, system-ui, sans-serif;
  --body:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, "Roboto Mono", monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --ground:#101613; --surface:#18201B; --ink:#E8EEE9; --muted:#9AA9A0; --line:#2B362F; --soft:#222C26;
  --done:#51CF66; --done-soft:#1C3324; --g1:#E8EEE9; --g2:#18201B; } }
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#101613; --surface:#18201B; --ink:#E8EEE9; --muted:#9AA9A0; --line:#2B362F; --soft:#222C26;
  --done:#51CF66; --done-soft:#1C3324; --g1:#E8EEE9; --g2:#18201B; }
*{box-sizing:border-box}
body{background:var(--ground); color:var(--ink); font:15px/1.4 var(--body); margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--day); outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- móvil ---------- */
.app{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:0 40px}
.top{position:sticky; top:0; z-index:5; background:var(--ground); margin-inline:-16px; padding:12px 16px 10px; border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px}
.brand h1{font:800 20px/1 var(--display); letter-spacing:-.01em; margin:0}
.brand span{font-size:12px; color:var(--muted)}
.brand.pwa{background:#3a3a3a; color:#fff; margin:-12px -16px 10px; padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px; align-items:center; justify-content:flex-start; gap:10px}
.brand.pwa img{height:24px; width:auto; display:block}
.brand.pwa h1{flex:1; font-size:16px}
.brand.pwa a{color:#fff; text-decoration:none; font-size:13px; font-weight:600; background:rgba(255,255,255,.12); border-radius:10px; padding:8px 11px}
.print-btn{justify-self:start; border:0; background:var(--ink); color:var(--ground); border-radius:10px; padding:10px 14px; font-weight:600}
.days{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
.day-btn{border:1.5px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 6px 6px; text-align:left; position:relative; overflow:hidden}
.day-btn b{display:block; font:700 15px/1.1 var(--display)}
.day-btn small{font-size:11px; color:var(--muted)}
.day-btn i{position:absolute; left:0; bottom:0; height:3px; background:var(--c); width:var(--p,0%); transition:width .3s}
.day-btn[aria-pressed="true"]{border-color:var(--c); background:var(--c); color:#fff}
.day-btn[aria-pressed="true"] small{color:#ffffffcc}
.day-btn[aria-pressed="true"] i{background:#fff}
.groups{display:flex; gap:6px; margin-top:8px}
.chip{flex:1; border:1.5px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 4px; font-size:13px; font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--ground)}
.next{display:flex; gap:10px; align-items:center; margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--line)}
.next .lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.next strong{display:block; font-size:15px}
.next.all{background:var(--done-soft); border-color:transparent}

.mapcard{margin-top:12px; background:#fff; border-radius:14px; border:1px solid var(--line); position:relative; overflow:hidden}
.mapscroll{overflow:auto; -webkit-overflow-scrolling:touch; max-height:70vh}
.mapscroll svg{display:block; width:calc(100% * var(--z,1)); height:auto}
.zoom{position:absolute; right:8px; top:8px; display:flex; flex-direction:column; gap:4px}
.zoom button{width:36px; height:36px; border-radius:9px; border:1px solid #cfd8d1; background:#fffffff0; color:#18221C; font-size:20px; font-weight:600; line-height:1}
.legend{display:flex; flex-wrap:wrap; gap:6px 14px; padding:8px 12px; font-size:12px; color:#4b5a51; border-top:1px solid #e3e9e4; background:#fafcfa}
.legend span{display:inline-flex; align-items:center; gap:5px}

.list{margin-top:16px; display:grid; gap:10px}
.turno{display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start}
.tnum{width:34px; height:34px; border-radius:50%; background:var(--day); color:#fff; display:grid; place-items:center; font:800 16px/1 var(--display); margin-top:6px}
.turno.done .tnum{background:var(--done)}
.cards{display:grid; gap:8px}
.cards.pair{grid-template-columns:1fr 1fr}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 10px 10px 12px; display:flex; gap:8px; align-items:flex-start; min-width:0}
.card.flash{box-shadow:0 0 0 3px var(--day)}
.card.done{background:var(--done-soft); border-color:transparent}
.card.done .fname{text-decoration:line-through; text-decoration-thickness:1.5px; color:var(--muted)}
.card .body{flex:1; min-width:0}
.fname{font-weight:600; font-size:15px; line-height:1.2; overflow-wrap:anywhere; background:none; border:0; padding:0; text-align:left}
.meta{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-top:4px; font-size:12px; color:var(--muted)}
.code{font:700 13px/1 var(--mono); color:var(--ink)}
.who{font-size:11px; font-weight:700; padding:2px 7px; border-radius:999px; border:1.5px solid var(--ink); letter-spacing:.02em}
.who.g1{background:var(--g1); color:var(--g2)}
.who.g2{background:var(--g2); color:var(--g1)}
.who.gt{background:var(--day); border-color:var(--day); color:#fff}
.who.gx{background:var(--surface); border-color:var(--day); color:var(--ink); white-space:normal}
.note{font-size:12px; color:var(--muted); margin-top:4px}
.hora{font:700 12.5px/1 var(--mono); color:var(--day)}
.pausa{display:flex; align-items:center; gap:10px; margin-left:44px; padding:7px 12px; border-radius:10px; background:var(--soft); font-size:13px; color:var(--muted)}
.pausa b{color:var(--ink); font-weight:600}
.libre{margin-left:44px; padding:10px 12px; border-radius:12px; border:1.5px dashed var(--day); font-size:13px; color:var(--muted); display:grid; gap:6px}
.libre b{color:var(--ink)}
.libre button{justify-self:start; background:none; border:0; padding:0; color:var(--day); font-weight:600; text-decoration:underline; text-underline-offset:2px}
.check{flex:none; width:40px; height:40px; border-radius:10px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center}
.check svg{width:22px; height:22px; opacity:0}
.card.done .check{background:var(--done); border-color:var(--done)}
.card.done .check svg{opacity:1}
.foot{margin-top:28px; display:grid; gap:12px; font-size:13px; color:var(--muted)}
.roster{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center}
.reset{justify-self:start; border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:8px 12px; font-size:13px}
.reset.arm{border-color:#C92A2A; color:#C92A2A; font-weight:600}
@media (max-width:420px){ .cards.pair{grid-template-columns:1fr} }

/* mapa (compartido) */
.base{filter:saturate(.22) contrast(.92) brightness(1.06)}
.wash{fill:#fff; opacity:.28}
.route{fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round}
.casing{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; opacity:.9}
.pin text{font:800 9px var(--display); fill:#fff; text-anchor:middle; dominant-baseline:central}
.pin .tag text{font:700 6.6px var(--body); dominant-baseline:central}
.pin.dim{opacity:.18}
.pin{cursor:pointer}
.pulse{fill:none; stroke-width:2; animation:pulse 1.6s ease-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{0%{opacity:.9; transform:scale(1)}100%{opacity:0; transform:scale(2.1)}}
@media (prefers-reduced-motion: reduce){ .pulse{animation:none; opacity:.6} }

/* ---------- imprimible ---------- */
@page{size:A4 landscape; margin:9mm}
.print{display:none}
body.mode-print{background:#fff; color:#18221C; -webkit-print-color-adjust:exact; print-color-adjust:exact}
body.mode-print .app{display:none}
body.mode-print .print{display:block}
.sheet{width:279mm; height:191mm; display:grid; grid-template-columns:1fr 1fr; column-gap:14mm; page-break-after:always; break-after:page; position:relative}
.sheet:last-child{page-break-after:auto; break-after:auto}
.sheet::after{content:""; position:absolute; left:50%; top:0; bottom:0; border-left:1px dashed #c8d0ca}
.half{display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden}
.band{display:flex; align-items:center; gap:10px; color:#fff; background:var(--day); border-radius:8px; padding:7px 12px}
.band b{font:800 22px/1 var(--display)}
.band span{font-size:12px; opacity:.92}
.band .hall{margin-left:auto; font-weight:600}
.pmap{margin-top:5mm; border:1px solid #dfe5e0; border-radius:6px; overflow:hidden; flex:none}
.pmap svg{display:block; width:100%; height:auto; max-height:118mm}
.plegend{margin-top:4mm; display:grid; grid-template-columns:1fr 1fr; gap:2.5mm 6mm; font-size:10.5px; color:#3d4a42}
.plegend div{display:flex; align-items:center; gap:6px}
.proster{margin-top:auto; display:grid; grid-template-columns:auto 1fr; gap:2mm 4mm; font-size:11px; align-items:center; padding-top:4mm; border-top:1px solid #e3e9e4}
.ptitle{font:800 15px/1.1 var(--display); margin:0 0 3mm; display:flex; justify-content:space-between; align-items:baseline}
.ptitle small{font:500 10px var(--body); color:#5D6B62}
table.it{width:100%; border-collapse:collapse; font-size:10.5px}
table.it .who{white-space:nowrap; font-size:10px; padding:1px 6px}
table.it th{font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#5D6B62; text-align:left; font-weight:600; padding:0 4px 2mm}
table.it td{padding:1.1mm 4px; border-top:1px solid #e3e9e4; vertical-align:middle}
table.it tr.tstart td{border-top:1.4px solid #9aa79e}
table.it .tn{font:800 13px/1 var(--display); color:var(--day); width:7mm; text-align:center}
table.it .f{font-weight:600}
table.it .n{display:block; font-weight:400; font-size:9.5px; color:#5D6B62}
table.it .sc{font:700 11px var(--mono); white-space:nowrap}
table.it .box{width:7mm}
table.it .hr{font:700 10px var(--mono); white-space:nowrap; color:var(--day)}
table.it tr.pz td{background:#eef2ef; font-size:10px; color:#5D6B62; padding-block:1mm}
table.it tr.pl td{border-top:1.4px dashed var(--day); font-size:10px; color:#3d4a42; padding-block:1.3mm}
table.it .box i{display:block; width:4.2mm; height:4.2mm; border:1.4px solid #18221C; border-radius:1mm}
.notes{margin-top:auto; padding-top:3mm; flex:0 1 auto; min-height:0; overflow:hidden}
.notes div{border-bottom:1px solid #d5ddd7; height:7mm}
.notes p{margin:0; font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:#5D6B62}
</style>

</head>

const NS = "http://www.w3.org/2000/svg";
const KEY = "expoflor26-ruta";
let st = {day: 1, group: "T", zoom: 1, checks: {}};
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayOf = n => D.days.find(d => d.n === n);
const visible = (s, g) => g === "T" || s.who === "T" || s.who === g;
const horaDe = (s, g) => {
  if (s.horaTxt) return s.horaTxt;
  if (s.who !== "T") return s.hora[s.who].join("–");
  const a = s.hora["1"], b = s.hora["2"];
  if (g !== "T") return s.hora[g].join("–");
  return a.join() === b.join() ? a.join("–") : `G1 ${a[0]} · G2 ${b[0]}`;

/* ---- SVG del mapa para un día ---- */
function mapSVG(day, o) {
  const [vx, vy, vw, vh] = day.vb, m = D.map;
  let h = `<svg xmlns="${NS}" viewBox="${vx} ${vy} ${vw} ${vh}" role="img" aria-label="Plano del día ${day.n}">`;

  h += `<rect class="wash" x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}"/>`;

  for (const g of ["1", "2"]) {
    if (o.group !== "T" && o.group !== g) continue;
    const pts = day.stops.filter(s => s.who === "T" || s.who === g).map(s => `${s.x},${s.y}`).join(" ");
    h += `<polyline class="casing" points="${pts}"/>`;
    h += `<polyline class="route" points="${pts}" stroke="${day.color}" ${g === "2" ? 'stroke-dasharray="1 4.2"' : ""} ${g === "2" ? 'stroke-width="2.8"' : ""}/>`;
  }
  for (const e of day.extra || []) {
    h += `<g class="pin" data-id="x-${e.stand}"><circle cx="${e.x}" cy="${e.y}" r="7" fill="#fff" stroke="${day.color}" stroke-width="1.6" stroke-dasharray="2.4 1.8"/>`;
    h += `<text x="${e.x}" y="${e.y + .4}" style="fill:${day.color};font-size:8px">+</text></g>`;
  }
  // pines: los de TODOS al final para que queden arriba
  const order = [...day.stops].sort((a, b) => (a.who === "T") - (b.who === "T"));
  for (const s of order) {
    const done = !o.print && st.checks[s.id], dim = !visible(s, o.group);
    const r = s.who === "T" ? 10 : 8.5, fill = done ? "#2B8A3E" : day.color;
    h += `<g class="pin${dim ? " dim" : ""}" data-id="${s.id}">`;
    if (o.next === s.id) h += `<circle class="pulse" cx="${s.x}" cy="${s.y}" r="${r}" stroke="${day.color}"/>`;
    if (s.who === "T") h += `<circle cx="${s.x}" cy="${s.y}" r="${r + 2.6}" fill="#fff" stroke="${fill}" stroke-width="1.6"/>`;
    h += `<circle cx="${s.x}" cy="${s.y}" r="${r}" fill="${fill}" stroke="#fff" stroke-width="1.6"/>`;
    h += done ? `<path d="M${s.x - 4} ${s.y + .3}l2.8 2.8 5.2-5.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`
              : `<text x="${s.x}" y="${s.y + .4}">${s.turno}</text>`;
    if (s.who !== "T") {   // globito con el grupo
      const txt = whoLabel(s.who, o.print), w = o.print ? 29 : 15, th = 10.5, gap = r + 3;
      let bx = s.x - w / 2, by = s.y - gap - th, tx = s.x, ty = by + th / 2, tail;
      if (s.bal === "d") { by = s.y + gap; ty = by + th / 2; tail = `${s.x - 3},${by} ${s.x + 3},${by} ${s.x},${by - 3}`; }
      else if (s.bal === "l") { bx = s.x - gap - w; by = s.y - th / 2; tx = bx + w / 2; ty = s.y; tail = `${bx + w},${s.y - 3} ${bx + w},${s.y + 3} ${bx + w + 3},${s.y}`; }
      else tail = `${s.x - 3},${by + th} ${s.x + 3},${by + th} ${s.x},${by + th + 3}`;
      const dark = s.who === "1";
      h += `<g class="tag"><rect x="${bx}" y="${by}" width="${w}" height="${th}" rx="5" fill="${dark ? "#18221C" : "#fff"}" stroke="#18221C" stroke-width="1"/>`;
      h += `<polygon points="${tail}" fill="#18221C"/>`;
      h += `<text x="${tx}" y="${ty}" style="fill:${dark ? "#fff" : "#18221C"}" text-anchor="middle">${txt}</text></g>`;
    }
    h += `</g>`;
  }
  return h + `</svg>`;
}

const legendHTML = (day, print) => {
  const pin = (t, ring) => `<svg width="18" height="18" viewBox="-9 -9 18 18">${ring ? `<circle r="8.6" fill="#fff" stroke="${day.color}" stroke-width="1.4"/>` : ""}<circle r="${ring ? 6.4 : 7}" fill="${day.color}"/><text y=".5" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="800" fill="#fff" font-family="sans-serif">${t}</text></svg>`;
  const line = dash => `<svg width="26" height="8"><line x1="2" y1="4" x2="24" y2="4" stroke="${day.color}" stroke-width="2.6" stroke-linecap="round" ${dash ? 'stroke-dasharray="1 4.5"' : ""}/></svg>`;
  const tag = g => `<svg width="${print ? 40 : 22}" height="13"><rect x=".5" y=".5" width="${print ? 39 : 21}" height="12" rx="6" fill="${g === "1" ? "#18221C" : "#fff"}" stroke="#18221C"/><text x="${print ? 20 : 11}" y="7" text-anchor="middle" dominant-baseline="central" font-size="8" font-weight="700" fill="${g === "1" ? "#fff" : "#18221C"}" font-family="sans-serif">${whoLabel(g, print)}</text></svg>`;
  const it = (ic, t) => print ? `<div>${ic}${t}</div>` : `<span>${ic}${t}</span>`;
  return (it(pin(1), "Número de turno") + it(pin(1, true), "Visita de todos") + it(tag("1"), "Va el Grupo 1") + it(tag("2"), "Va el Grupo 2")
       + it(line(false), "Recorrido Grupo 1") + it(line(true), "Recorrido Grupo 2")
       + (day.extra && day.extra.length ? "" : "\u0000") + it(`<svg width="18" height="18" viewBox="-9 -9 18 18"><circle r="7" fill="#fff" stroke="${day.color}" stroke-width="1.6" stroke-dasharray="2.4 1.8"/><text y=".5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="800" fill="${day.color}" font-family="sans-serif">+</text></svg>`, "Breeder sugerido para el tiempo libre")).split("\u0000")[0];
};
const rosterHTML = () => ["1", "2"].map(g => `<span class="who g${g}">Grupo ${g}</span><span>${D.roster[g].join(" · ")}</span>`).join("");

const pausasDe = (day, t, g) => day.pausas.filter(p => p.antes === t && (g === "T" || p.g === "T" || p.g === g));
function pausaHTML(p, g, print) {
  if (p.tipo === "D") return print ? `<tr class="tstart pz"><td></td><td class="hr">${p.i}–${p.f}</td><td colspan="4">Descanso</td></tr>`
                                   : `<div class="pausa"><b>${p.i}–${p.f}</b> Descanso</div>`;
  const quien = p.g === "T" ? "" : `Grupo ${p.g} · `;
  const sug = Object.entries(p.sug).filter(([k, v]) => v && (g === "T" || k === g))
    .map(([k, v]) => print ? `${Object.keys(p.sug).length > 1 ? "G" + k + ": " : ""}${esc(v.name)} (${v.stand})`
                           : `<button type="button" data-loc="x-${v.stand}">${Object.keys(p.sug).length > 1 && g === "T" ? "G" + k + " · " : ""}${esc(v.name)} · ${v.stand}</button>`);
  const sinSug = "para una finca nueva o una reunión que surja (no quedan breeders libres en este bloque)";
  return print ? `<tr class="tstart pl"><td class="tn">+</td><td class="hr">${p.i}–${p.f}</td><td colspan="4"><b>${quien}Tiempo libre ${p.min} min</b> · ${sug.length ? "breeder sugerido: " + sug.join(" · ") : sinSug}</td></tr>`
    : `<div class="libre"><div><b class="hora">${p.i}–${p.f}</b> <b>${quien}Tiempo libre · ${p.min} min</b><br>${sug.length ? "Para otra reunión. Breeder sugerido cerca:" : "Para otra reunión: " + sinSug + "."}</div>${sug.join("")}</div>`;
}

/* ---- móvil ---- */
function nextStop(day) {
  return day.stops.find(s => visible(s, st.group) && !st.checks[s.id]);
}
function render() {
  const day = dayOf(st.day);
  document.documentElement.style.setProperty("--day", day.color);
  const daysEl = document.getElementById("days");
  daysEl.innerHTML = D.days.map(d => {
    const vis = d.stops.filter(s => visible(s, st.group)), ok = vis.filter(s => st.checks[s.id]).length;
    const [wd, , dd, , mm] = d.date.split(" ");
    return `<button class="day-btn" type="button" aria-pressed="${d.n === st.day}" data-day="${d.n}" style="--c:${d.color};--p:${100 * ok / vis.length}%">
      <b>Día ${d.n}</b><small>${wd.slice(0, 3)} ${dd} oct · ${ok}/${vis.length}</small><i></i></button>`;
  }).join("");
  document.getElementById("groups").innerHTML = [["T", "Ver todo"], ["1", "Grupo 1"], ["2", "Grupo 2"]]
    .map(([g, t]) => `<button class="chip" type="button" aria-pressed="${st.group === g}" data-group="${g}">${t}</button>`).join("");

  const nx = nextStop(day), nextEl = document.getElementById("next");
  nextEl.className = "next" + (nx ? "" : " all");
  nextEl.innerHTML = nx
    ? `<div class="tnum">${nx.turno}</div><div><div class="lbl">Sigue · ${whoLabel(nx.who, true)}</div><strong>${esc(nx.finca)}</strong><span class="hora">${horaDe(nx, st.group)}</span> <span class="code">${nx.stand}</span> <span class="meta" style="display:inline">· Bloque ${nx.hall}</span></div>`
    : `<div><div class="lbl">Día ${day.n} completo</div><strong>Todas las visitas ${st.group === "T" ? "" : "del Grupo " + st.group + " "}están marcadas</strong></div>`;

  const ms = document.getElementById("mapscroll");
  ms.style.setProperty("--z", st.zoom);
  ms.innerHTML = mapSVG(day, {group: st.group, next: nx && nx.id});
  document.getElementById("legend").innerHTML = legendHTML(day, false);

  // lista agrupada por turno
  let html = day.pre ? `<div class="pausa"><b>${day.pre.i}–${day.pre.f}</b> ${day.pre.n}</div>` : "";
  for (let t = 1; t <= day.turnos; t++) {
    for (const p of pausasDe(day, t, st.group)) html += pausaHTML(p, st.group, false);
    const ss = day.stops.filter(s => s.turno === t && visible(s, st.group));
    if (!ss.length) continue;
    const allDone = ss.every(s => st.checks[s.id]);
    html += `<div class="turno${allDone ? " done" : ""}"><div class="tnum">${t}</div><div class="cards${ss.length > 1 ? " pair" : ""}">`;
    for (const s of ss) {
      html += `<div class="card${st.checks[s.id] ? " done" : ""}" id="c-${s.id}">
        <div class="body"><button class="fname" type="button" data-loc="${s.id}">${esc(s.finca)}</button>
        <div class="meta"><span class="hora">${horaDe(s, st.group)}</span><span class="code">${s.stand}</span><span>Bloque ${s.hall}</span>${pill(s, false)}</div>
        ${s.note ? `<div class="note">${esc(s.note)}</div>` : ""}</div>
        <button class="check" type="button" data-check="${s.id}" aria-pressed="${!!st.checks[s.id]}" aria-label="Marcar ${esc(s.finca)} como visitada">${CHECK}</button></div>`;
    }
    html += `</div></div>`;
  }
  for (const p of pausasDe(day, day.turnos + 1, st.group)) html += pausaHTML(p, st.group, false);
  document.getElementById("list").innerHTML = html;
  document.getElementById("roster").innerHTML = rosterHTML();
  resetArmed = false; document.getElementById("reset").className = "reset";
  document.getElementById("reset").textContent = "Borrar los checks de este día";
}

function locate(id) {
  const s = id.startsWith("x-") ? dayOf(st.day).extra.find(e => "x-" + e.stand === id) : dayOf(st.day).stops.find(x => x.id === id), ms = document.getElementById("mapscroll"), svg = ms.querySelector("svg");
  if (!s || !svg) return;
  const [vx, vy, vw, vh] = dayOf(st.day).vb, k = svg.clientWidth / vw;
  ms.scrollTo({left: (s.x - vx) * k - ms.clientWidth / 2, top: (s.y - vy) * k - ms.clientHeight / 2, behavior: "smooth"});
  ms.closest(".mapcard").scrollIntoView({behavior: "smooth", block: "center"});
  const pin = svg.querySelector(`[data-id="${id}"]`);
  if (pin) pin.animate([{opacity: 1}, {opacity: .2}, {opacity: 1}, {opacity: .2}, {opacity: 1}], {duration: 1200});
}
let resetArmed = false;
function initMobile() {
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-day],[data-group],[data-check],[data-loc],.pin,#zin,#zout,#reset");
    if (!b) return;
    if (b.dataset.day) { st.day = +b.dataset.day; st.zoom = 1; }
    else if (b.dataset.group) st.group = b.dataset.group;
    else if (b.dataset.check) { st.checks[b.dataset.check] ? delete st.checks[b.dataset.check] : st.checks[b.dataset.check] = Date.now(); }
    else if (b.dataset.loc) return locate(b.dataset.loc);
    else if (b.classList.contains("pin")) {
      const c = document.getElementById("c-" + b.dataset.id);
      if (c) { c.scrollIntoView({behavior: "smooth", block: "center"}); c.classList.add("flash"); setTimeout(() => c.classList.remove("flash"), 1500); }
      return;
    }
    else if (b.id === "zin" || b.id === "zout") {
      st.zoom = Math.min(3, Math.max(1, st.zoom + (b.id === "zin" ? .5 : -.5)));
      document.getElementById("mapscroll").style.setProperty("--z", st.zoom); save(); return;
    }
    else if (b.id === "reset") {
      if (!resetArmed) { resetArmed = true; b.className = "reset arm"; b.textContent = "Tocá otra vez para borrar los checks del día " + st.day; return; }
      dayOf(st.day).stops.forEach(s => delete st.checks[s.id]);
    }
    save(); render();
  });
  render();
}

/* ---- imprimible: un pliego por día ---- */
function initPrint() {
  document.body.classList.add("mode-print");
  document.getElementById("print").innerHTML = D.days.map(day => {
    let rows = day.pre ? `<tr class="tstart pz"><td></td><td class="hr">${day.pre.i}–${day.pre.f}</td><td colspan="4">${day.pre.n}</td></tr>` : "", prev = 0;
    for (const s of day.stops) {
      if (s.turno !== prev) for (const p of pausasDe(day, s.turno, "T")) rows += pausaHTML(p, "T", true);
      rows += `<tr class="${s.turno !== prev ? "tstart" : ""}"><td class="tn">${s.turno !== prev ? s.turno : ""}</td><td class="hr">${horaDe(s, "T").replace(" · ", "<br>")}</td>
        <td class="f">${esc(s.finca)}${s.note ? `<span class="n">${esc(s.note)}</span>` : ""}</td><td class="sc">${s.stand}</td>
        <td>${pill(s, true)}</td><td class="box"><i></i></td></tr>`;
      prev = s.turno;
    }
    return `<section class="sheet" style="--day:${day.color}">
      <div class="half">
        <div class="band"><b>Día ${day.n}</b><span>${day.date}</span><span class="hall">${day.hall}</span></div>
        <div class="pmap">${mapSVG(day, {group: "T", print: true})}</div>
        <div class="plegend">${legendHTML(day, true)}</div>
        <div class="proster">${rosterHTML()}</div>
      </div>
      <div class="half">
        <h2 class="ptitle">Itinerario · ${day.stops.length} fincas en ${day.turnos} turnos <small>ExpoFlor 2026 · Quito</small></h2>
        <table class="it"><thead><tr><th>T.</th><th>Hora</th><th>Finca</th><th>Stand</th><th>Quién</th><th>✓</th></tr></thead><tbody>${rows}</tbody></table>
        <div class="notes"><p>Notas</p><div></div><div></div><div></div></div>
      </div></section>`;
  }).join("");
}
MODE === "print" ? initPrint() : initMobile();
const pb = document.getElementById("imprimir");
if (pb) {
  pb.addEventListener("click", () => { initPrint(); setTimeout(() => window.print(), 300); });
  addEventListener("afterprint", () => document.body.classList.remove("mode-print"));
}
</script>

if ('serviceWorker' in navigator) {
  // al activarse una versión nueva se recarga una vez (solo si ya había una versión anterior controlando la página)
  const habia = !!navigator.serviceWorker.controller;
  let recargada = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habia && !recargada) { recargada = true; location.reload(); } });
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>

  <div style="font-size:18px;font-weight:700">Ruta de la feria</div>
  <div style="font-size:13px;opacity:.7;margin:6px 0 20px;max-width:290px">Uso interno. Escribí el código de acceso que te pasó el equipo; se pide una sola vez en este teléfono.</div>
  <form id="lockf" style="width:100%;max-width:300px;display:flex;flex-direction:column;gap:10px">
    <input id="lockc" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="código de acceso" aria-label="Código de acceso"
      style="font-size:17px;padding:13px 14px;border-radius:12px;border:0;text-align:center;color:#242422;background:#fff">
    <button style="font-size:16px;font-weight:800;padding:13px;border-radius:12px;background:var(--lima);color:#25300a">Entrar</button>
    <div id="locke" style="font-size:13px;color:#ffb4ab;min-height:18px"></div>
  </form>
</div>
<script>
(async () => {
  const P = JSON.parse(document.getElementById('denc').textContent);
  const lock = document.getElementById('lock'), err = document.getElementById('locke');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norma = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s_-]+/g, '').toLowerCase();
  async function abre(cod) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norma(cod)), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(P.s), iterations: P.it, hash: 'SHA-256'},
                                           base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(P.iv)}, k, b64(P.ct)));
  }
  function arranca(json) {
    document.getElementById('d').textContent = json;
    const s = document.createElement('script');
    s.textContent = document.getElementById('app').textContent;
    document.body.appendChild(s);
    lock.style.display = 'none';
  }
  if (!window.crypto || !crypto.subtle) { lock.style.display = 'flex'; err.textContent = 'Abrí el enlace con https:// para poder entrar.'; return; }
  let guardado = null;
  try { guardado = localStorage.getItem('ecl-codigo'); } catch (e) {}
  if (guardado) {
    try { arranca(await abre(guardado)); return; }
    catch (e) { try { localStorage.removeItem('ecl-codigo'); } catch (_) {} }   // cambió el código: se vuelve a pedir
  }
  lock.style.display = 'flex';
  document.getElementById('lockf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const cod = document.getElementById('lockc').value;
    err.textContent = 'Abriendo…';
    try {
      const json = await abre(cod);
      try { localStorage.setItem('ecl-codigo', norma(cod)); } catch (e) {}
      err.textContent = ''; arranca(json);
    } catch (e) { err.textContent = 'Código incorrecto.'; }
  });
})();
</script>
